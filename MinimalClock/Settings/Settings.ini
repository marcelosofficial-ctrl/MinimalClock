[Variables]
@include=#@#Settings.inc

[Rainmeter]
Update=-1
AccurateText=1
DynamicWindowSize=1

[Metadata]
Name=MinimalClock Settings
Author=Celo
Information=Settings panel for MinimalClock.
Version=1.0.0
License=MIT

[StyleLabel]
FontFace=Segoe UI
FontColor=235,235,235,255
FontSize=11
AntiAlias=1
StringAlign=Left

[StyleButton]
FontFace=Segoe UI
FontColor=235,235,235,255
FontSize=10
AntiAlias=1
StringAlign=CenterCenter
SolidColor=255,255,255,18
Padding=8,4,8,4
MouseActionCursor=1

[MeterBackground]
Meter=Image
SolidColor=18,18,18,248
W=460
H=414

[MeterTitle]
Meter=String
Text=MINIMALCLOCK
FontFace=Segoe UI
FontColor=255,255,255,255
FontSize=16
StringStyle=Bold
AntiAlias=1
X=24
Y=20

[MeterSubtitle]
Meter=String
Text=Settings
FontFace=Segoe UI
FontColor=150,150,150,255
FontSize=10
AntiAlias=1
X=25
Y=48

[MeterClose]
Meter=String
MeterStyle=StyleButton
Text=CLOSE
X=398
Y=29
LeftMouseUpAction=[!DeactivateConfig]

[MeterCurrent]
Meter=String
Text=#TimeMode#  |  Seconds #SecondsState#  |  #ScaleLabel#  |  #OpacityLabel#  |  #ThemeName#
FontFace=Segoe UI
FontColor=150,150,150,255
FontSize=9
AntiAlias=1
DynamicVariables=1
X=24
Y=72

[LabelTime]
Meter=String
MeterStyle=StyleLabel
Text=Time format
X=24
Y=108

[Button24]
Meter=String
MeterStyle=StyleButton
Text=24H
X=188
Y=114
LeftMouseUpAction=[!WriteKeyValue Variables TimeMode "24H" "#@#Settings.inc"][!WriteKeyValue Variables HourFormat "%H" "#@#Settings.inc"][!WriteKeyValue Variables PeriodHidden 1 "#@#Settings.inc"][!Refresh "#ROOTCONFIG#"][!Refresh]

[Button12]
Meter=String
MeterStyle=StyleButton
Text=12H
X=250
Y=114
LeftMouseUpAction=[!WriteKeyValue Variables TimeMode "12H" "#@#Settings.inc"][!WriteKeyValue Variables HourFormat "%I" "#@#Settings.inc"][!WriteKeyValue Variables PeriodHidden 0 "#@#Settings.inc"][!Refresh "#ROOTCONFIG#"][!Refresh]

[LabelSeconds]
Meter=String
MeterStyle=StyleLabel
Text=Seconds
X=24
Y=150

[ButtonSecondsOn]
Meter=String
MeterStyle=StyleButton
Text=SHOW
X=188
Y=156
LeftMouseUpAction=[!WriteKeyValue Variables SecondsHidden 0 "#@#Settings.inc"][!WriteKeyValue Variables SecondsState "On" "#@#Settings.inc"][!Refresh "#ROOTCONFIG#"][!Refresh]

[ButtonSecondsOff]
Meter=String
MeterStyle=StyleButton
Text=HIDE
X=260
Y=156
LeftMouseUpAction=[!WriteKeyValue Variables SecondsHidden 1 "#@#Settings.inc"][!WriteKeyValue Variables SecondsState "Off" "#@#Settings.inc"][!Refresh "#ROOTCONFIG#"][!Refresh]

[LabelScale]
Meter=String
MeterStyle=StyleLabel
Text=Scale
X=24
Y=192

[ButtonScale80]
Meter=String
MeterStyle=StyleButton
Text=80%
X=188
Y=198
LeftMouseUpAction=[!WriteKeyValue Variables Scale 0.8 "#@#Settings.inc"][!WriteKeyValue Variables ScaleLabel "80%" "#@#Settings.inc"][!Refresh "#ROOTCONFIG#"][!Refresh]

[ButtonScale100]
Meter=String
MeterStyle=StyleButton
Text=100%
X=248
Y=198
LeftMouseUpAction=[!WriteKeyValue Variables Scale 1.0 "#@#Settings.inc"][!WriteKeyValue Variables ScaleLabel "100%" "#@#Settings.inc"][!Refresh "#ROOTCONFIG#"][!Refresh]

[ButtonScale125]
Meter=String
MeterStyle=StyleButton
Text=125%
X=320
Y=198
LeftMouseUpAction=[!WriteKeyValue Variables Scale 1.25 "#@#Settings.inc"][!WriteKeyValue Variables ScaleLabel "125%" "#@#Settings.inc"][!Refresh "#ROOTCONFIG#"][!Refresh]

[LabelOpacity]
Meter=String
MeterStyle=StyleLabel
Text=Opacity
X=24
Y=234

[ButtonOpacity100]
Meter=String
MeterStyle=StyleButton
Text=100%
X=188
Y=240
LeftMouseUpAction=[!WriteKeyValue Variables Opacity 255 "#@#Settings.inc"][!WriteKeyValue Variables OpacityLabel "100%" "#@#Settings.inc"][!Refresh "#ROOTCONFIG#"][!Refresh]

[ButtonOpacity80]
Meter=String
MeterStyle=StyleButton
Text=80%
X=260
Y=240
LeftMouseUpAction=[!WriteKeyValue Variables Opacity 204 "#@#Settings.inc"][!WriteKeyValue Variables OpacityLabel "80%" "#@#Settings.inc"][!Refresh "#ROOTCONFIG#"][!Refresh]

[ButtonOpacity60]
Meter=String
MeterStyle=StyleButton
Text=60%
X=326
Y=240
LeftMouseUpAction=[!WriteKeyValue Variables Opacity 153 "#@#Settings.inc"][!WriteKeyValue Variables OpacityLabel "60%" "#@#Settings.inc"][!Refresh "#ROOTCONFIG#"][!Refresh]

[LabelTheme]
Meter=String
MeterStyle=StyleLabel
Text=Theme
X=24
Y=276

[ButtonThemeWhite]
Meter=String
MeterStyle=StyleButton
Text=WHITE
X=188
Y=282
LeftMouseUpAction=[!WriteKeyValue Variables ThemeName "White" "#@#Settings.inc"][!WriteKeyValue Variables PrimaryColor "255,255,255,255" "#@#Settings.inc"][!WriteKeyValue Variables SecondaryColor "205,205,205,225" "#@#Settings.inc"][!WriteKeyValue Variables MutedColor "165,165,165,210" "#@#Settings.inc"][!WriteKeyValue Variables DividerColor "205,205,205,150" "#@#Settings.inc"][!Refresh "#ROOTCONFIG#"][!Refresh]

[ButtonThemeWarm]
Meter=String
MeterStyle=StyleButton
Text=WARM
X=258
Y=282
LeftMouseUpAction=[!WriteKeyValue Variables ThemeName "Warm" "#@#Settings.inc"][!WriteKeyValue Variables PrimaryColor "255,244,224,255" "#@#Settings.inc"][!WriteKeyValue Variables SecondaryColor "224,207,179,225" "#@#Settings.inc"][!WriteKeyValue Variables MutedColor "190,170,145,210" "#@#Settings.inc"][!WriteKeyValue Variables DividerColor "224,207,179,150" "#@#Settings.inc"][!Refresh "#ROOTCONFIG#"][!Refresh]

[ButtonThemeIce]
Meter=String
MeterStyle=StyleButton
Text=ICE
X=326
Y=282
LeftMouseUpAction=[!WriteKeyValue Variables ThemeName "Ice" "#@#Settings.inc"][!WriteKeyValue Variables PrimaryColor "232,247,255,255" "#@#Settings.inc"][!WriteKeyValue Variables SecondaryColor "186,221,235,225" "#@#Settings.inc"][!WriteKeyValue Variables MutedColor "145,181,196,210" "#@#Settings.inc"][!WriteKeyValue Variables DividerColor "186,221,235,150" "#@#Settings.inc"][!Refresh "#ROOTCONFIG#"][!Refresh]

[MeterReset]
Meter=String
MeterStyle=StyleButton
Text=RESET DEFAULTS
X=248
Y=337
LeftMouseUpAction=[!WriteKeyValue Variables TimeMode "24H" "#@#Settings.inc"][!WriteKeyValue Variables HourFormat "%H" "#@#Settings.inc"][!WriteKeyValue Variables PeriodHidden 1 "#@#Settings.inc"][!WriteKeyValue Variables SecondsHidden 0 "#@#Settings.inc"][!WriteKeyValue Variables SecondsState "On" "#@#Settings.inc"][!WriteKeyValue Variables Scale 1.0 "#@#Settings.inc"][!WriteKeyValue Variables ScaleLabel "100%" "#@#Settings.inc"][!WriteKeyValue Variables Opacity 255 "#@#Settings.inc"][!WriteKeyValue Variables OpacityLabel "100%" "#@#Settings.inc"][!WriteKeyValue Variables ThemeName "White" "#@#Settings.inc"][!WriteKeyValue Variables PrimaryColor "255,255,255,255" "#@#Settings.inc"][!WriteKeyValue Variables SecondaryColor "205,205,205,225" "#@#Settings.inc"][!WriteKeyValue Variables MutedColor "165,165,165,210" "#@#Settings.inc"][!WriteKeyValue Variables DividerColor "205,205,205,150" "#@#Settings.inc"][!Refresh "#ROOTCONFIG#"][!Refresh]

[MeterHint]
Meter=String
Text=Right-click the clock to reopen this panel.
FontFace=Segoe UI
FontColor=125,125,125,255
FontSize=9
AntiAlias=1
X=24
Y=380

; MinimalClock
; Lightweight Rainmeter clock with no plugins, scripts, or network calls.

[Variables]
@include=#@#Settings.inc

; Internal layout tokens. These are visual tuning values, not user settings.
TimeY=0
SecondsX=342
SecondsY=24
SecondsSize=54
SecondsLabelY=98
SecondsLabelSize=30

[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
OnRefreshAction=[!SetTransparency "#Opacity#"]
RightMouseUpAction=[!SkinCustomMenu]
ContextTitle=MinimalClock settings...
ContextAction=[!ActivateConfig "#ROOTCONFIG#\Settings" "Settings.ini"]
ContextTitle2=Edit settings file
ContextAction2=["#CONFIGEDITOR#" "#@#Settings.inc"]
ContextTitle3=Rainmeter menu
ContextAction3=[!SkinMenu]

[Metadata]
Name=MinimalClock
Author=Celo
Information=A lightweight, typography-first desktop clock built natively for Rainmeter.
Version=1.0.0
License=MIT

[MeasureHour]
Measure=Time
Format=#HourFormat#

[MeasureMinute]
Measure=Time
Format=%M

[MeasureSecond]
Measure=Time
Format=%S
Disabled=#SecondsHidden#

[MeasurePeriod]
Measure=Time
Format=%p
Disabled=#PeriodHidden#

[MeasureDay]
Measure=Time
Format=%w
Substitute="0":"SUN","1":"MON","2":"TUE","3":"WED","4":"THU","5":"FRI","6":"SAT"

[MeasureDate]
Measure=Time
Format=%d

[MeasureMonth]
Measure=Time
Format=%m
Substitute="01":"JAN","02":"FEB","03":"MAR","04":"APR","05":"MAY","06":"JUN","07":"JUL","08":"AUG","09":"SEP","10":"OCT","11":"NOV","12":"DEC"

[MeasureYear]
Measure=Time
Format=%Y

[MeterBase]
Meter=Image
SolidColor=0,0,0,1
X=0
Y=0
W=(#Scale#*(570+(90*(1-#SecondsHidden#))))
H=(#Scale#*180)

[MeterHour]
Meter=String
MeasureName=MeasureHour
FontFace=#FontFace#
FontColor=#PrimaryColor#
FontSize=(96*#Scale#)
StringAlign=Left
AntiAlias=1
X=(10*#Scale#)
Y=(#TimeY#*#Scale#)

[MeterPeriod]
Meter=String
MeasureName=MeasurePeriod
FontFace=#FontFace#
FontColor=#MutedColor#
FontSize=(13*#Scale#)
StringAlign=Center
AntiAlias=1
Hidden=#PeriodHidden#
X=(70*#Scale#)
Y=(113*#Scale#)

[MeterMinute]
Meter=String
MeasureName=MeasureMinute
FontFace=#FontFace#
FontColor=#PrimaryColor#
FontSize=(96*#Scale#)
StringAlign=Left
AntiAlias=1
X=(156*#Scale#)
Y=(#TimeY#*#Scale#)

[MeterSecond]
Meter=String
MeasureName=MeasureSecond
FontFace=#FontFace#
FontColor=#SecondaryColor#
FontSize=(#SecondsSize#*#Scale#)
StringAlign=Center
AntiAlias=1
Hidden=#SecondsHidden#
X=(#SecondsX#*#Scale#)
Y=(#SecondsY#*#Scale#)

[MeterSecondLabel]
Meter=String
Text=SEC
FontFace=#FontFace#
FontColor=#MutedColor#
FontSize=(#SecondsLabelSize#*#Scale#)
StringStyle=Normal
StringAlign=Center
AntiAlias=1
Hidden=#SecondsHidden#
X=(#SecondsX#*#Scale#)
Y=(#SecondsLabelY#*#Scale#)

[MeterDivider]
Meter=Image
SolidColor=#DividerColor#
X=(#Scale#*(310+(90*(1-#SecondsHidden#))))
Y=(28*#Scale#)
W=(1*#Scale#)
H=(116*#Scale#)

[MeterDay]
Meter=String
MeasureName=MeasureDay
FontFace=#FontFace#
FontColor=#SecondaryColor#
FontSize=(34*#Scale#)
StringAlign=Left
AntiAlias=1
X=(#Scale#*(340+(90*(1-#SecondsHidden#))))
Y=(37*#Scale#)

[MeterDate]
Meter=String
MeasureName=MeasureDate
FontFace=#FontFace#
FontColor=#SecondaryColor#
FontSize=(27*#Scale#)
StringAlign=Left
AntiAlias=1
X=(#Scale#*(448+(90*(1-#SecondsHidden#))))
Y=(46*#Scale#)

[MeterMonth]
Meter=String
MeasureName=MeasureMonth
FontFace=#FontFace#
FontColor=#SecondaryColor#
FontSize=(34*#Scale#)
StringAlign=Left
AntiAlias=1
X=(#Scale#*(340+(90*(1-#SecondsHidden#))))
Y=(87*#Scale#)

[MeterYear]
Meter=String
MeasureName=MeasureYear
FontFace=#FontFace#
FontColor=#MutedColor#
FontSize=(24*#Scale#)
StringAlign=Left
AntiAlias=1
X=(#Scale#*(430+(90*(1-#SecondsHidden#))))
Y=(98*#Scale#)
